---
# GitHub stand-in: bare repos under /srv/git, reached through system-wide insteadOf
# rules, so the role's alias URLs (git@github-<name>:owner/repo.git) clone locally.
- name: Prepare
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Ensure the test user exists
      ansible.builtin.user:
        name: dev
        create_home: true
        shell: /bin/bash

    - name: Ensure dev's ~/.ssh exists
      ansible.builtin.file:
        path: /home/dev/.ssh
        state: directory
        owner: dev
        mode: "0700"

    - name: Ensure dev's user manager runs (the laptop user is logged in)
      ansible.builtin.command:
        cmd: loginctl enable-linger dev
        creates: /var/lib/systemd/linger/dev

    # An ~/.ssh/config of the user's own, with the managed block an earlier version of the
    # role wrote there: the block goes, the user's lines stay.
    - name: Give dev an ~/.ssh/config with an old managed block
      ansible.builtin.copy:
        dest: /home/dev/.ssh/config
        owner: dev
        mode: "0600"
        content: |
          Host github.com
              IdentityFile ~/.ssh/id_ed25519
          # BEGIN ANSIBLE MANAGED BLOCK danmwallace.linux.git_repo_sync
          Host github-old
              HostName github.com
          # END ANSIBLE MANAGED BLOCK danmwallace.linux.git_repo_sync
        force: false

    - name: Ensure the bare repos exist with one commit each
      ansible.builtin.shell:
        cmd: |
          set -e
          for r in vault config existing; do
            git init -q --bare -b main /srv/git/owner/$r.git
            git -c user.name=t -c user.email=t@t clone -q /srv/git/owner/$r.git /tmp/seed-$r
            echo "$r" > /tmp/seed-$r/README.md
            git -C /tmp/seed-$r add -A
            git -C /tmp/seed-$r -c user.name=t -c user.email=t@t commit -qm init
            git -C /tmp/seed-$r push -q origin main
          done
          chown -R dev: /srv/git
        executable: /bin/bash
        creates: /srv/git/owner/existing.git

    - name: Ensure alias and github.com URLs resolve to the local bare repos
      ansible.builtin.copy:
        dest: /etc/gitconfig
        mode: "0644"
        content: |
          [url "/srv/git/"]
              insteadOf = git@github-vault:
              insteadOf = git@github-config:
              insteadOf = git@github-existing:
              insteadOf = git@github-missing:
              insteadOf = git@github.com:
          [url "/srv/git/nowhere/"]
              insteadOf = git@github-existing2:
              insteadOf = git@github-existing3:
          [safe]
              directory = *

    - name: Ensure a second pre-existing clone exists whose alias will not reach origin
      become: true
      become_user: dev
      ansible.builtin.shell:
        cmd: |
          set -e
          git clone -q /srv/git/owner/existing.git /home/dev/existing2
          git -C /home/dev/existing2 remote set-url origin git@github.com:owner/existing2.git
        executable: /bin/bash
        creates: /home/dev/existing2

    - name: Ensure a pre-existing clone with a github.com origin and a local edit exists
      become: true
      become_user: dev
      ansible.builtin.shell:
        cmd: |
          set -e
          git clone -q git@github.com:owner/existing.git /home/dev/existing
          echo "local edit" > /home/dev/existing/README.md
        executable: /bin/bash
        creates: /home/dev/existing

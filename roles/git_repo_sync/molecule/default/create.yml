---
- name: Create
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure the molecule test image is built
      containers.podman.podman_image:
        name: localhost/git-repo-sync-molecule
        path: "{{ playbook_dir }}"
        build:
          file: "{{ playbook_dir }}/Containerfile"
        state: build

    - name: Ensure the systemd test container is running
      containers.podman.podman_container:
        name: linux-git-repo-sync-instance
        image: localhost/git-repo-sync-molecule
        systemd: always
        # A user manager (lingering dev) fails here unprivileged: "Failed to allocate
        # manager object: Permission denied" under rootless podman 5.8 / kernel 7.2, with
        # fc42 and fc44 images alike. Rootless, so privileged stays inside the user namespace.
        privileged: true
        state: started
        command: /sbin/init

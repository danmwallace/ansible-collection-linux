---
argument_specs:
  main:
    short_description: Configure TLS for an existing Cockpit installation.
    description:
      - Copies a Let's Encrypt certificate and key into Cockpit's certificate
        directory, installs a certbot renewal hook, and enables the cockpit service.
    author: Dan Wallace [danmwallace]
    options:
      cockpit_hostname:
        description:
          - Hostname used to name the copied cert/key files
            (C(<hostname>.crt) / C(<hostname>.key)) and to build the default
            Let's Encrypt certificate path.
        type: str
        required: false
        default: "{{ inventory_hostname }}"
      cockpit_letsencrypt_cert_path:
        description:
          - Source directory holding C(fullchain.pem) and C(privkey.pem).
        type: path
        required: false
        default: "/etc/letsencrypt/live/{{ cockpit_hostname }}"
      cockpit_cert_path:
        description:
          - Directory Cockpit reads its TLS material from; the cert and key are
            copied here.
        type: path
        required: false
        default: "/etc/cockpit/ws-certs.d"
      cockpit_allowed_cidr:
        description:
          - DEPRECATED; use C(cockpit_allowed_cidrs). A single source CIDR, formerly
            UFW-only with a default of C(10.0.0.0/8). It no longer has a default; if
            set, it is appended to C(cockpit_allowed_cidrs) for both firewall
            backends and a deprecation notice is printed.
        type: str
        required: false
      cockpit_cert_owner:
        description:
          - Owner of the certificate and key in C(cockpit_cert_path). Defaults to
            C(cockpit-ws) on Debian-family hosts and C(root) elsewhere; Fedora has no
            C(cockpit-ws) user.
        type: str
        required: false
        default: "{{ 'cockpit-ws' if ansible_facts.os_family == 'Debian' else 'root' }}"
      cockpit_cert_group:
        description: Group of the certificate and key in C(cockpit_cert_path).
        type: str
        required: false
        default: "{{ cockpit_cert_owner }}"
      cockpit_cert_mode:
        description: Mode applied to the certificate and key in C(cockpit_cert_path).
        type: str
        required: false
        default: "0600"
      cockpit_service_name:
        description:
          - systemd unit managed and restarted after a certificate change.
            C(cockpit.service) is static on Fedora, so the socket is the correct unit.
        type: str
        required: false
        default: cockpit.socket
      cockpit_allowed_cidrs:
        description:
          - Source CIDRs (IPv4 or IPv6) allowed to reach Cockpit on TCP 9090. Each
            entry becomes a firewalld rich rule on RedHat-family hosts or a UFW allow
            rule on Ubuntu.
          - Required while C(cockpit_manage_firewall) is true on those hosts; the role
            fails early when it is empty instead of leaving 9090 open to every source.
        type: list
        elements: str
        required: false
        default: []
      cockpit_manage_firewall:
        description:
          - Manage the host firewall (firewalld or UFW) for TCP 9090. Set false only
            when something else scopes port 9090; the role then skips the
            C(cockpit_allowed_cidrs) check and all firewall tasks.
        type: bool
        required: false
        default: true
      cockpit_remove_blanket_firewalld_service:
        description:
          - Disables the zone-wide C(cockpit) firewalld service (RedHat-family
            hosts), so only the C(cockpit_allowed_cidrs) rich rules grant access to
            port 9090. Acts only when C(cockpit_manage_firewall) is true.
        type: bool
        required: false
        default: true
      cockpit_firewalld_zone:
        description:
          - firewalld zone the rich rules and blanket-service removal act on. An
            empty string uses firewalld's default zone. Set this explicitly on a
            host whose active interfaces are bound to a non-default zone, or the
            rules land in a zone nothing uses.
        type: str
        required: false
        default: ""

---
argument_specs:
  main:
    short_description: Configure TLS for an existing Cockpit installation.
    description:
      - Copies a Let's Encrypt certificate and key into Cockpit's certificate
        directory, installs a certbot renewal hook, and enables the cockpit service.
    author: Dan Wallace [danmwallace]
    options:
      cockpit_hostname:
        description:
          - Hostname used to name the copied cert/key files
            (C(<hostname>.crt) / C(<hostname>.key)) and to build the default
            Let's Encrypt certificate path.
        type: str
        required: false
        default: "{{ inventory_hostname }}"
      cockpit_letsencrypt_cert_path:
        description:
          - Source directory holding C(fullchain.pem) and C(privkey.pem).
        type: path
        required: false
        default: "/etc/letsencrypt/live/{{ cockpit_hostname }}"
      cockpit_cert_path:
        description:
          - Directory Cockpit reads its TLS material from; the cert and key are
            copied here.
        type: path
        required: false
        default: "/etc/cockpit/ws-certs.d"
      cockpit_allowed_cidr:
        description:
          - Source CIDR allowed to reach Cockpit on port 9090 via UFW (Ubuntu only).
            Restrict to your homelab or VPN CIDR for tighter scoping.
        type: str
        required: false
        default: "10.0.0.0/8"
      cockpit_cert_owner:
        description:
          - Owner of the certificate and key in C(cockpit_cert_path). Defaults to
            C(cockpit-ws) on Debian-family hosts and C(root) elsewhere; Fedora has no
            C(cockpit-ws) user.
        type: str
        required: false
        default: "{{ 'cockpit-ws' if ansible_facts.os_family == 'Debian' else 'root' }}"
      cockpit_cert_group:
        description: Group of the certificate and key in C(cockpit_cert_path).
        type: str
        required: false
        default: "{{ cockpit_cert_owner }}"
      cockpit_cert_mode:
        description: Mode applied to the certificate and key in C(cockpit_cert_path).
        type: str
        required: false
        default: "0600"
      cockpit_service_name:
        description:
          - systemd unit managed and restarted after a certificate change.
            C(cockpit.service) is static on Fedora, so the socket is the correct unit.
        type: str
        required: false
        default: cockpit.socket
      cockpit_allowed_cidrs:
        description:
          - Source CIDRs allowed to reach Cockpit on TCP 9090 through firewalld
            (RedHat-family hosts). Each entry becomes a rich rule. An empty list leaves
            the firewall untouched, so upgrading never opens a port by itself.
        type: list
        elements: str
        required: false
        default: []

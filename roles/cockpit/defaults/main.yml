---
# defaults file for cockpit

cockpit_hostname: "{{ inventory_hostname }}" # Default to inventory_hostname if none provided in playbook
cockpit_letsencrypt_cert_path: "/etc/letsencrypt/live/{{ cockpit_hostname }}"
cockpit_cert_path: "/etc/cockpit/ws-certs.d"

# Cockpit reads its TLS material as root on Fedora; Debian ships a cockpit-ws user.
cockpit_cert_owner: "{{ 'cockpit-ws' if ansible_facts.os_family == 'Debian' else 'root' }}"
cockpit_cert_group: "{{ cockpit_cert_owner }}"
cockpit_cert_mode: "0600"

# cockpit.service is static on Fedora, so the socket is the unit to manage.
cockpit_service_name: cockpit.socket

# Source CIDRs allowed to reach Cockpit on port 9090 through firewalld
# (RedHat family). Empty means the firewall is left untouched.
cockpit_allowed_cidrs: []

# Source CIDR allowed to reach Cockpit (port 9090) via UFW on Ubuntu. Defaults to
# RFC-1918 private ranges; set to your homelab CIDR (e.g. 192.168.1.0/24) for
# tighter scoping.
cockpit_allowed_cidr: "10.0.0.0/8"

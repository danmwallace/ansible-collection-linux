---
# ###############################################################
# Setup Cockpit with TLS
#
# cockpit_letsencrypt_cert_path = directory holding the Let's Encrypt lineage
# cockpit_cert_path             = directory Cockpit reads its TLS material from

- name: Ensure the Cockpit certificate directory exists
  ansible.builtin.file:
    path: "{{ cockpit_cert_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Check whether the Let's Encrypt lineage is present
  ansible.builtin.stat:
    path: "{{ cockpit_letsencrypt_cert_path }}/fullchain.pem"
  register: cockpit_lineage
  become: true

- name: Assert a certificate exists to install
  ansible.builtin.assert:
    that: cockpit_lineage.stat.exists
    fail_msg: >-
      No certificate at {{ cockpit_letsencrypt_cert_path }} — run
      danmwallace.linux.cloudflare_ssl first.
  when: not ansible_check_mode

- name: Ensure the Cockpit certificate is installed
  ansible.builtin.copy:
    src: "{{ cockpit_letsencrypt_cert_path }}/fullchain.pem"
    dest: "{{ cockpit_cert_path }}/{{ cockpit_hostname }}.crt"
    remote_src: true
    owner: "{{ cockpit_cert_owner }}"
    group: "{{ cockpit_cert_group }}"
    mode: "{{ cockpit_cert_mode }}"
  become: true
  when: cockpit_lineage.stat.exists
  notify: Restart cockpit

- name: Ensure the Cockpit private key is installed
  ansible.builtin.copy:
    src: "{{ cockpit_letsencrypt_cert_path }}/privkey.pem"
    dest: "{{ cockpit_cert_path }}/{{ cockpit_hostname }}.key"
    remote_src: true
    owner: "{{ cockpit_cert_owner }}"
    group: "{{ cockpit_cert_group }}"
    mode: "{{ cockpit_cert_mode }}"
  become: true
  when: cockpit_lineage.stat.exists
  notify: Restart cockpit

- name: Ensure the certbot deploy hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure the Cockpit certificate deploy hook is present
  ansible.builtin.template:
    src: cockpit-cert-deploy.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/10-cockpit.sh
    owner: root
    group: root
    mode: "0755"
  become: true

# Superseded by the deploy hook above, which runs only on an actual renewal.
- name: Ensure the legacy post-renewal hook is absent
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/post/001-restart-cockpit.sh
    state: absent
  become: true

- name: Ensure the Cockpit socket is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ cockpit_service_name }}"
    enabled: true
    state: started
  become: true

- name: Ensure Cockpit is reachable from the allowed CIDRs (firewalld)
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ item }} port port=9090 protocol=tcp accept"
    zone: "{{ cockpit_firewalld_zone | default(omit, true) }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ cockpit_allowed_cidrs }}"
  become: true
  when:
    - ansible_facts.os_family == "RedHat"
    - cockpit_allowed_cidrs | length > 0

# Additive rich rules cannot narrow access while the zone-wide "cockpit" firewalld
# service (all sources, port 9090) stays enabled; it must be disabled for the rich
# rules above to actually restrict access to cockpit_allowed_cidrs.
- name: Ensure the zone-wide Cockpit firewalld service is not enabled
  ansible.posix.firewalld:
    service: cockpit
    zone: "{{ cockpit_firewalld_zone | default(omit, true) }}"
    state: disabled
    permanent: true
    immediate: true
  become: true
  when:
    - ansible_facts.os_family == "RedHat"
    - cockpit_allowed_cidrs | length > 0
    - cockpit_remove_blanket_firewalld_service

- name: Ensure Cockpit is reachable from the allowed CIDR (UFW)
  community.general.ufw:
    rule: allow
    port: "9090"
    proto: tcp
    from_ip: "{{ cockpit_allowed_cidr }}"
  become: true
  notify: Restart cockpit
  when:
    - ansible_facts.os_family == "Debian"
    - ansible_facts.distribution == "Ubuntu"

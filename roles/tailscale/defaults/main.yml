tailscale_exit_node: false
# sha256 of Tailscale's binary apt signing key (the .noarmor.gpg file, the
# same for every Debian and Ubuntu release). With a checksum, get_url leaves a
# matching keyring alone without downloading, so check mode reports it as
# unchanged; it also refuses a downloaded key that doesn't match. If Tailscale
# rotates the key the role fails here: verify the new key and update this.
# An empty string skips the check (check mode then always reports changed).
tailscale_apt_key_checksum: "sha256:3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39"

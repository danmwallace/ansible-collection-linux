---
# tasks file for cloudflare_ssl

- name: Assert the Cloudflare credentials are configured
  ansible.builtin.assert:
    that:
      - cloudflare_ssl_email | length > 0
      - cloudflare_ssl_api_token | length > 0
      - cloudflare_ssl_domains | length > 0
    fail_msg: >-
      cloudflare_ssl_email, cloudflare_ssl_api_token and cloudflare_ssl_domains
      must all be set (supply the first two from Ansible Vault).

- name: Ensure certbot and the Cloudflare DNS plugin are installed (Debian family)
  ansible.builtin.package:
    name: "{{ cloudflare_ssl_debian_packages }}"
    state: present
  become: true
  when: ansible_facts.os_family == "Debian"
  register: _cloudflare_ssl_pkg_debian

- name: Ensure certbot and the Cloudflare DNS plugin are installed (RedHat family)
  ansible.builtin.package:
    name: "{{ cloudflare_ssl_fedora_packages }}"
    state: present
  become: true
  when: ansible_facts.os_family == "RedHat"
  register: _cloudflare_ssl_pkg_redhat

- name: Ensure the directory for Cloudflare credentials exists
  ansible.builtin.file:
    path: /root/.secrets
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Ensure the Cloudflare credentials file is present
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: /root/.secrets/cloudflare.ini
    owner: root
    group: root
    mode: "0400"
  become: true
  no_log: true

- name: Ensure a certificate exists for {{ cloudflare_ssl_domains | join(', ') }}
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      --dns-cloudflare
      --dns-cloudflare-credentials /root/.secrets/cloudflare.ini
      --dns-cloudflare-propagation-seconds 60
      --agree-tos
      --email {{ cloudflare_ssl_email }}
      --non-interactive
      --cert-name {{ cloudflare_ssl_domains[0] }}
      --domains {{ cloudflare_ssl_domains | join(',') }}
    creates: "/etc/letsencrypt/live/{{ cloudflare_ssl_domains[0] }}/cert.pem"
  become: true

- name: Ensure the certbot renewal timer is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ _cloudflare_ssl_renewal_timer }}"
    enabled: true
    state: started
  become: true
  # In check mode on a fresh host the package was never actually installed, so
  # the timer unit does not exist yet and systemd cannot find it.
  when:
    - cloudflare_ssl_manage_renewal_timer
    - not (ansible_check_mode and (_cloudflare_ssl_pkg_debian is changed or _cloudflare_ssl_pkg_redhat is changed))

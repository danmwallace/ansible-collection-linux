---
- name: Verify
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Check the certbot CLI is installed
      ansible.builtin.command: command -v certbot
      register: cloudflare_ssl_t_bin
      changed_when: false

    - name: Stat the Cloudflare credentials file
      ansible.builtin.stat:
        path: /root/.secrets/cloudflare.ini
      register: cloudflare_ssl_t_creds

    - name: Assert the CLI and the root-only credentials file are present
      ansible.builtin.assert:
        that:
          - cloudflare_ssl_t_bin.stdout | length > 0
          - cloudflare_ssl_t_creds.stat.exists
          - cloudflare_ssl_t_creds.stat.mode == '0400'
          - cloudflare_ssl_t_creds.stat.pw_name == 'root'

    - name: Check the renewal timer is enabled
      ansible.builtin.command: systemctl is-enabled certbot-renew.timer  # noqa command-instead-of-module
      register: cloudflare_ssl_t_timer
      changed_when: false

    - name: Check the renewal timer is active
      ansible.builtin.command: systemctl is-active certbot-renew.timer  # noqa command-instead-of-module
      register: cloudflare_ssl_t_timer_active
      changed_when: false

    - name: Assert the renewal timer is enabled and running
      ansible.builtin.assert:
        that:
          - cloudflare_ssl_t_timer.stdout == 'enabled'
          - cloudflare_ssl_t_timer_active.stdout == 'active'

    - name: Read the fake certificate back
      ansible.builtin.slurp:
        src: /etc/letsencrypt/live/ssl.test.local/cert.pem
      register: cloudflare_ssl_t_cert

    - name: Stat the archive directory certbot would have created
      ansible.builtin.stat:
        path: /etc/letsencrypt/archive
      register: cloudflare_ssl_t_archive

    - name: Assert certbot never ran against the existing lineage
      ansible.builtin.assert:
        that:
          - "'molecule fake certificate' in (cloudflare_ssl_t_cert.content | b64decode)"
          - not cloudflare_ssl_t_archive.stat.exists

# --- cloudflare_ssl_install_packages: image-based hosts (bootc, rpm-ostree) ---
# Present the container as one by setting the fact the role default reads
# (ansible_facts.pkg_mgr == 'atomic_container'), instead of passing
# cloudflare_ssl_install_packages, so the default itself is under test.
- name: Verify package installs are skipped on an image-based host
  hosts: molecule
  gather_facts: true
  vars:
    _t_role_vars: &t_role_vars
      cloudflare_ssl_email: molecule@test.local
      cloudflare_ssl_api_token: molecule-fake-token  # molecule-test-only: fake value, not a real credential
      cloudflare_ssl_domains:
        - ssl.test.local
  tasks:
    - name: Record the real package manager
      ansible.builtin.set_fact:
        cloudflare_ssl_t_real_pkg_mgr: "{{ ansible_facts.pkg_mgr }}"

    - name: Present this host as image-based  # noqa: var-naming[no-role-prefix]  pkg_mgr is the fact under test
      ansible.builtin.set_fact:
        pkg_mgr: atomic_container
        cacheable: true  # cacheable writes ansible_facts.pkg_mgr, not just a host var

    - name: Apply the role on the image-based host while certbot is present
      ansible.builtin.include_role:
        name: danmwallace.linux.cloudflare_ssl
      vars: *t_role_vars

    - name: Assert the install task was skipped and the binary check ran
      ansible.builtin.assert:
        that:
          - _cloudflare_ssl_pkg_redhat is skipped
          - _cloudflare_ssl_binary_check.results | map(attribute='rc') | list == [0]

    # The package module would dispatch on the faked pkg_mgr, so name dnf5.
    - name: Ensure certbot is absent for the missing-binary check
      ansible.builtin.dnf5:
        name: certbot
        state: absent

    - name: Apply the role on the image-based host while certbot is missing
      block:
        - name: Run the role expected to fail (no certbot)
          ansible.builtin.include_role:
            name: danmwallace.linux.cloudflare_ssl
          vars: *t_role_vars
        - name: Record that the missing binary was not caught
          ansible.builtin.set_fact:
            cloudflare_ssl_t_nopkg_failed: false
      rescue:
        - name: Record that the missing binary failed the play
          ansible.builtin.set_fact:
            cloudflare_ssl_t_nopkg_failed: true
            cloudflare_ssl_t_nopkg_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: Check whether certbot came back
      ansible.builtin.command:
        argv: [sh, -c, command -v certbot]
      register: cloudflare_ssl_t_nopkg_bin
      changed_when: false
      failed_when: false

    - name: Assert a missing binary fails the role, naming it and the image, without installing it
      ansible.builtin.assert:
        that:
          - cloudflare_ssl_t_nopkg_failed
          - "'certbot (package certbot)' in cloudflare_ssl_t_nopkg_msg"
          - "'image must provide' in cloudflare_ssl_t_nopkg_msg"
          - _cloudflare_ssl_pkg_redhat is skipped
          - cloudflare_ssl_t_nopkg_bin.rc != 0
        fail_msg: "failed: {{ cloudflare_ssl_t_nopkg_failed }}, msg: {{ cloudflare_ssl_t_nopkg_msg | default('') }}"

    - name: Present this host as package-managed again  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        pkg_mgr: "{{ cloudflare_ssl_t_real_pkg_mgr }}"
        cacheable: true

    - name: Apply the role on the package-managed host
      ansible.builtin.include_role:
        name: danmwallace.linux.cloudflare_ssl
      vars: *t_role_vars

    - name: Check certbot is installed again
      ansible.builtin.command:
        argv: [sh, -c, command -v certbot]
      register: cloudflare_ssl_t_repkg_bin
      changed_when: false

    - name: Assert the package-managed host installed certbot
      ansible.builtin.assert:
        that:
          - cloudflare_ssl_t_real_pkg_mgr != 'atomic_container'
          - _cloudflare_ssl_pkg_redhat is changed
          - cloudflare_ssl_t_repkg_bin.stdout | length > 0

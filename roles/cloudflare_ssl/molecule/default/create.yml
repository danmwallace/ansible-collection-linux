---
- name: Create
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure the molecule test image is built
      containers.podman.podman_image:
        name: localhost/cloudflare-ssl-molecule
        path: "{{ playbook_dir }}"
        build:
          file: "{{ playbook_dir }}/Containerfile"
        state: build

    - name: Ensure the systemd test container is running
      containers.podman.podman_container:
        name: cloudflare-ssl-instance
        image: localhost/cloudflare-ssl-molecule
        systemd: always
        state: started
        command: /sbin/init

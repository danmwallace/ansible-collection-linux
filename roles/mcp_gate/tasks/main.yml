---
- name: Check the gate keys
  ansible.builtin.assert:
    that:
      - mcp_gate_ro_keys | length > 0
      - mcp_gate_ro_keys | reject('match', '^ssh-ed25519 [A-Za-z0-9+/=]+( \S+)?\s*$') | list | length == 0
    fail_msg: mcp_gate_ro_keys needs at least one key, each a single "ssh-ed25519 <key> [comment]" line.
    quiet: true

- name: Check the ops keys
  ansible.builtin.assert:
    that:
      - mcp_gate_ops_keys | reject('match', '^ssh-ed25519 [A-Za-z0-9+/=]+( \S+)?\s*$') | list | length == 0
      - mcp_gate_ops_keys | length == 0 or mcp_gate_ops_vms | length > 0
      - mcp_gate_ops_user | length > 0 and mcp_gate_ops_user != mcp_gate_ro_user
    fail_msg: >-
      mcp_gate_ops_keys must be single "ssh-ed25519 <key> [comment]" lines and need a
      non-empty mcp_gate_ops_vms (without one the gate refuses every ops request);
      mcp_gate_ops_user must be set and differ from mcp_gate_ro_user.
    quiet: true

- name: Settle where gate/mcp-gate comes from
  ansible.builtin.set_fact:
    mcp_gate_checkout: >-
      {{ mcp_gate_src_dir if mcp_gate_src_dir | length > 0
         else mcp_gate_cache_dir ~ '/' ~ mcp_gate_version }}

- name: Ensure homelab-mcp is checked out on the controller at {{ mcp_gate_version }}
  ansible.builtin.git:
    repo: "{{ mcp_gate_source }}"
    dest: "{{ mcp_gate_checkout }}"
    version: "{{ mcp_gate_version }}"
    depth: 1
    single_branch: true
  delegate_to: localhost
  become: false
  run_once: true
  # A clone into the controller's cache changes nothing on the target, and the copy below
  # needs the file, so it runs in check mode too.
  check_mode: false
  when: mcp_gate_src_dir | length == 0

- name: Ensure the gate is installed
  ansible.builtin.copy:
    src: "{{ mcp_gate_checkout }}/gate/mcp-gate"
    dest: /usr/local/libexec/mcp-gate
    owner: root
    group: root
    mode: "0755"

- name: Ensure the gate config is in place
  ansible.builtin.template:
    src: mcp-gate.json.j2
    dest: /etc/mcp-gate.json
    owner: root
    group: root
    mode: "0644"

- name: Ensure the read-only account and its keys
  ansible.builtin.include_tasks: account.yml
  vars:
    mcp_gate_account:
      user: "{{ mcp_gate_ro_user }}"
      comment: MCP read-only gate
      groups: [systemd-journal]
      mode: ro
      authorized: "{{ mcp_gate_ro_keys }}"

# mcp-ops is in libvirt (start and shutdown need management access through polkit), so its
# forced command, `mcp-gate ops`, and the gate's ops_vms list are what limit it.
- name: Ensure the ops account and its keys
  ansible.builtin.include_tasks: account.yml
  vars:
    mcp_gate_account:
      user: "{{ mcp_gate_ops_user }}"
      comment: MCP ops gate (VM start and shutdown)
      groups: [libvirt, systemd-journal]
      mode: ops
      authorized: "{{ mcp_gate_ops_keys }}"
  when: mcp_gate_ops_keys | length > 0

# Revoking is emptying mcp_gate_ops_keys: the account (in libvirt) and its key file go too,
# so no key it had keeps working. The home (root's, holding only .ssh) goes first: userdel -r
# refuses a home the account doesn't own.
- name: Ensure no ops account home is left when there are no ops keys
  ansible.builtin.file:
    path: "/home/{{ mcp_gate_ops_user }}"
    state: absent
  when: mcp_gate_ops_keys | length == 0

- name: Ensure no ops account is left when there are no ops keys
  ansible.builtin.user:
    name: "{{ mcp_gate_ops_user }}"
    state: absent
  when: mcp_gate_ops_keys | length == 0

- name: Read the account's groups
  ansible.builtin.command:
    argv: [id, -nG, "{{ mcp_gate_ro_user }}"]
  register: mcp_gate_groups
  changed_when: false
  check_mode: false
  # In check mode on a new host the account doesn't exist yet (the user task only reported it).
  failed_when: mcp_gate_groups.rc != 0 and not ansible_check_mode

- name: Stop if the account is in libvirt (full management through polkit)
  ansible.builtin.assert:
    that: "'libvirt' not in mcp_gate_groups.stdout.split()"
    fail_msg: "{{ mcp_gate_ro_user }} is in libvirt, which grants full libvirt management; remove it."
    quiet: true

---
# One gate account: mcp_gate_account = {user, comment, groups, mode, authorized}. main.yml includes
# this for mcp-ro (ro) and, when mcp_gate_ops_keys is set, for mcp-ops (ops).
# sshd runs a forced command through the account's login shell, so it must be a real shell;
# the key's command=...,restrict is what keeps it from being a login.
- name: Ensure the gate account exists with only its fixed groups, {{ mcp_gate_account.user }}
  ansible.builtin.user:
    name: "{{ mcp_gate_account.user }}"
    comment: "{{ mcp_gate_account.comment }}"
    shell: /bin/bash
    password: "!"
    groups: "{{ mcp_gate_account.groups }}"
    append: false
    # No /etc/skel: files the account owns in its home (.bashrc, ~/.config) are read by its
    # login shell and user manager before or beside the gate. The home is created below.
    create_home: false

# The home and .ssh are root-owned: an account that owned either could swap in a key file
# of its own without command=...,restrict. The gate never writes there.
- name: Ensure the account's home is root-owned, {{ mcp_gate_account.user }}
  ansible.builtin.file:
    path: "/home/{{ mcp_gate_account.user }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The home holds only .ssh. Anything else (1.10.0 copied /etc/skel in) is removed.
- name: Find what else is in the account's home, {{ mcp_gate_account.user }}
  ansible.builtin.find:
    paths: "/home/{{ mcp_gate_account.user }}"
    file_type: any
    hidden: true
    recurse: false
    excludes: [".ssh"]
  register: mcp_gate_home_extra

- name: Ensure nothing but .ssh is in the account's home, {{ mcp_gate_account.user }}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ mcp_gate_home_extra.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure the account's .ssh folder is root-owned, {{ mcp_gate_account.user }}
  ansible.builtin.file:
    path: "/home/{{ mcp_gate_account.user }}/.ssh"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure only the account's keys are authorized, forced to the gate in its mode, {{ mcp_gate_account.user }}
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "/home/{{ mcp_gate_account.user }}/.ssh/authorized_keys"
    owner: root
    group: root
    mode: "0644"

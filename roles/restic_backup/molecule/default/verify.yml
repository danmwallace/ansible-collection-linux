---
- name: Verify
  hosts: molecule
  # vars/role.yml computes the prune weekday from ansible_date_time.
  gather_facts: true
  vars_files:
    - vars/role.yml
  vars:
    restic_env: "set -a; . /etc/restic-backup/restic-backup.env; set +a;"
  pre_tasks:
    - name: Read the test NAS host key
      ansible.builtin.slurp:
        src: /tmp/molecule-nas-host-key
      register: _molecule_host_key
  tasks:
    - name: Stat installed files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/restic-backup/restic-backup.env
        - /etc/restic-backup/id_ed25519
        - /usr/local/libexec/restic-backup/run
      register: _files

    - name: Assert secrets and script are root-only
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode in ['0600', '0700']
      loop: "{{ _files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check the timer is enabled
      ansible.builtin.command: systemctl is-enabled restic-backup.timer  # noqa command-instead-of-module
      register: _timer
      changed_when: false

    - name: Assert the timer is enabled
      ansible.builtin.assert:
        that: _timer.stdout == 'enabled'

    - name: Run one backup through the service
      ansible.builtin.systemd:
        name: restic-backup.service
        state: started

    - name: List the files in the latest snapshot
      ansible.builtin.shell:
        cmd: "{{ restic_env }} restic ls latest"
        executable: /bin/bash
      register: _ls
      changed_when: false

    - name: Assert the snapshot has the right content
      ansible.builtin.assert:
        that:
          - "'/srv/app/keep.txt' in _ls.stdout_lines"
          - "'/var/lib/restic-backup/dumps/pg-test.sql.gz' in _ls.stdout_lines"
          - "'/var/lib/restic-backup/dumps/maria-test.sql.gz' in _ls.stdout_lines"
          - "'/var/lib/restic-backup/dumps/sqlite/srv_app_data_state.db' in _ls.stdout_lines"
          - "'/var/lib/restic-backup/dumps/sqlite/srv_app_data_profiles_a_state.db' in _ls.stdout_lines"
          - "'/var/lib/restic-backup/dumps/sqlite/srv_app_data_profiles_b_state.db' in _ls.stdout_lines"
          - "'/var/lib/restic-backup/dumps/sqlite/srv_app_data_lit[1].db' in _ls.stdout_lines"
          - "'/srv/app/skip/skipped.txt' not in _ls.stdout_lines"
          - "'/srv/app/data/state.db' not in _ls.stdout_lines"
          - "'/srv/app/after-snapshot.txt' not in _ls.stdout_lines"
          - "_ls.stdout_lines | select('search', 'restic-backup-snapshot') | list | length == 0"

    - name: Restore one file into a scratch directory
      ansible.builtin.shell:
        cmd: "{{ restic_env }} rm -rf /tmp/restore && restic restore latest --target /tmp/restore --include /srv/app/keep.txt && cat /tmp/restore/srv/app/keep.txt"
        executable: /bin/bash
      register: _restore
      changed_when: false

    - name: Assert the restored file matches
      ansible.builtin.assert:
        that: _restore.stdout_lines[-1] == 'keep-me'

    - name: Assert the restored SQLite dump is a readable database
      ansible.builtin.shell:
        cmd: >-
          {{ restic_env }} restic dump latest /var/lib/restic-backup/dumps/sqlite/srv_app_data_profiles_b_state.db > /tmp/b.db
          && sqlite3 /tmp/b.db 'select v from t'
        executable: /bin/bash
      register: _sqlite
      changed_when: false
      failed_when: _sqlite.stdout != '/srv/app/data/profiles/b'

    - name: Run a second backup to prove the service is repeatable
      ansible.builtin.systemd:
        name: restic-backup.service
        state: started

    - name: Count snapshots
      ansible.builtin.shell:
        cmd: "{{ restic_env }} restic snapshots --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))'"
        executable: /bin/bash
      register: _count
      changed_when: false

    - name: Assert two snapshots exist
      ansible.builtin.assert:
        that: _count.stdout | int == 2

    # --- restore entry point (tasks_from: restore) ---
    - name: Read the latest snapshot ID
      ansible.builtin.shell:
        cmd: >-
          {{ restic_env }} restic snapshots --json latest
          | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["short_id"])'
        executable: /bin/bash
      register: _snap
      changed_when: false

    - name: Restore the whole snapshot path by ID
      ansible.builtin.include_role:
        name: danmwallace.linux.restic_backup
        tasks_from: restore
      vars:
        restic_backup_restore_snapshot: "{{ _snap.stdout }}"
        restic_backup_restore_path: /srv/app
        restic_backup_restore_target: /tmp/restored-app

    - name: List the restored files
      ansible.builtin.command: find /tmp/restored-app -type f
      register: _restored_all
      changed_when: false

    - name: Assert the path's contents landed directly in the target
      ansible.builtin.assert:
        # latest also holds after-snapshot.txt: the fake btrfs wrote it into the
        # live tree during the first backup, so the second one picked it up.
        that:
          - "'/tmp/restored-app/keep.txt' in _restored_all.stdout_lines"
          - "'/tmp/restored-app/notes/n.txt' in _restored_all.stdout_lines"
          - _restored_all.stdout_lines | select('search', '^/tmp/restored-app/srv') | list | length == 0
        fail_msg: "restored: {{ _restored_all.stdout_lines | sort }}"

    - name: Read the restored file
      ansible.builtin.slurp:
        src: /tmp/restored-app/keep.txt
      register: _restored_keep

    - name: Assert the restored file matches
      ansible.builtin.assert:
        that: (_restored_keep.content | b64decode | trim) == 'keep-me'

    - name: Restore a subset, owned by another user
      ansible.builtin.include_role:
        name: danmwallace.linux.restic_backup
        tasks_from: restore
      vars:
        restic_backup_restore_snapshot: latest
        restic_backup_restore_path: /srv/app
        restic_backup_restore_target: /tmp/restored-subset
        restic_backup_restore_includes:
          - /notes
        restic_backup_restore_owner: nobody

    - name: List the restored subset with owners
      ansible.builtin.command: find /tmp/restored-subset -mindepth 1 -printf '%P %u\n'
      register: _restored_subset
      changed_when: false

    - name: Stat the subset target
      ansible.builtin.stat:
        path: /tmp/restored-subset
      register: _subset_target

    - name: Assert only the included path was restored, owned by nobody
      ansible.builtin.assert:
        that:
          - _restored_subset.stdout_lines | sort == ['notes nobody', 'notes/n.txt nobody']
          - _subset_target.stat.pw_name == 'nobody'
        fail_msg: "restored: {{ _restored_subset.stdout_lines | sort }}, target owner {{ _subset_target.stat.pw_name }}"

    - name: Restore with an include that matches nothing
      block:
        - name: Run the restore expected to fail (empty)
          ansible.builtin.include_role:
            name: danmwallace.linux.restic_backup
            tasks_from: restore
          vars:
            restic_backup_restore_snapshot: latest
            restic_backup_restore_path: /srv/app
            restic_backup_restore_target: /tmp/restored-nothing
            # The original absolute path: wrong, includes are relative to the path.
            restic_backup_restore_includes:
              - /srv/app/notes
        - name: Record that the empty restore was not caught
          ansible.builtin.set_fact:
            _empty_failed: false
      rescue:
        - name: Record that the empty restore failed the play
          ansible.builtin.set_fact:
            _empty_failed: true
            _empty_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: Assert an empty restore fails with a hint about includes
      ansible.builtin.assert:
        that:
          - _empty_failed
          - "'restored nothing' in _empty_msg"

    - name: Restore a snapshot that does not exist
      block:
        - name: Run the restore expected to fail (bogus)
          ansible.builtin.include_role:
            name: danmwallace.linux.restic_backup
            tasks_from: restore
          vars:
            restic_backup_restore_snapshot: deadbeef
            restic_backup_restore_path: /srv/app
            restic_backup_restore_target: /tmp/restored-bogus
        - name: Record that the bogus restore was not caught
          ansible.builtin.set_fact:
            _bogus_failed: false
      rescue:
        - name: Record that the bogus restore failed the play
          ansible.builtin.set_fact:
            _bogus_failed: true
            _bogus_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: Assert a missing snapshot fails with restic's reason
      ansible.builtin.assert:
        that:
          - _bogus_failed
          - "'deadbeef' in _bogus_msg"

    - name: Restore without naming a snapshot
      block:
        - name: Run the restore expected to fail (unnamed)
          ansible.builtin.include_role:
            name: danmwallace.linux.restic_backup
            tasks_from: restore
          vars:
            restic_backup_restore_path: /srv/app
            restic_backup_restore_target: /tmp/restored-unnamed
        - name: Record that the unnamed restore was not caught
          ansible.builtin.set_fact:
            _unnamed_failed: false
      rescue:
        - name: Record that the unnamed restore failed the play
          ansible.builtin.set_fact:
            _unnamed_failed: true
            _unnamed_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: Stat the unnamed restore's target
      ansible.builtin.stat:
        path: /tmp/restored-unnamed
      register: _unnamed_target

    - name: Assert a restore without a snapshot is refused before touching anything
      ansible.builtin.assert:
        that:
          - _unnamed_failed
          - "'restic_backup_restore_snapshot' in _unnamed_msg"
          - not _unnamed_target.stat.exists

    - name: Read the rendered service unit and script
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/systemd/system/restic-backup.service
        - /usr/local/libexec/restic-backup/run
      register: _rendered

    - name: Assert the AC-power condition and hourly retention are rendered
      ansible.builtin.assert:
        that:
          - "'ConditionACPower=true' in (_rendered.results[0].content | b64decode)"
          - "'--keep-hourly 24' in (_rendered.results[1].content | b64decode)"

    - name: Count prune runs in the journal
      ansible.builtin.shell:
        cmd: set -o pipefail && journalctl -u restic-backup.service --no-pager | grep -c 'weekly prune and integrity check'
        executable: /bin/bash
      register: _prunes
      changed_when: false
      failed_when: false

    - name: Read the prune stamp
      ansible.builtin.slurp:
        src: /var/lib/restic-backup/last-prune
      register: _stamp
      failed_when: false

    - name: Read today's date on the instance
      ansible.builtin.command: date +%F
      register: _today
      changed_when: false

    # Can fail if this run straddles midnight on the instance clock: the prune
    # stamp is written against the date at prune time, `_today` is read afterwards.
    # Re-run if this assertion fails around midnight.
    - name: Assert prune ran exactly once across two runs on the same day
      ansible.builtin.assert:
        that:
          - _prunes.stdout | int == 1
          - (_stamp.content | default('') | b64decode | trim) == _today.stdout

    - name: Stop sshd so the NAS is unreachable
      ansible.builtin.systemd:
        name: sshd
        state: stopped

    - name: Run the backup service while the NAS is unreachable
      ansible.builtin.systemd:
        name: restic-backup.service
        state: started

    - name: Read the service result and recent log  # noqa command-instead-of-module
      ansible.builtin.shell:
        cmd: systemctl show -p Result --value restic-backup.service; journalctl -u restic-backup.service --no-pager -n 20
        executable: /bin/bash
      register: _skipped
      changed_when: false

    - name: Start sshd again
      ansible.builtin.systemd:
        name: sshd
        state: started

    - name: Count snapshots after the skipped run
      ansible.builtin.shell:
        cmd: "{{ restic_env }} restic snapshots --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))'"
        executable: /bin/bash
      register: _count_after_skip
      changed_when: false

    - name: Assert the unreachable run succeeded without a new snapshot
      ansible.builtin.assert:
        that:
          - _skipped.stdout_lines[0] == 'success'
          - "'NAS unreachable, skipping this run' in _skipped.stdout"
          - _count_after_skip.stdout | int == 2

    - name: Stat the snapshot directory after the runs
      ansible.builtin.stat:
        path: /srv/app/.restic-backup-snapshot
      register: _snapdir

    - name: Assert the snapshot was removed
      ansible.builtin.assert:
        that: not _snapdir.stat.exists

    - name: Read the exclude file
      ansible.builtin.slurp:
        src: /etc/restic-backup/excludes.txt
      register: _excludes

    - name: Assert the snapshot directory is excluded
      ansible.builtin.assert:
        that: "'/srv/app/.restic-backup-snapshot' in (_excludes.content | b64decode).splitlines()"

    # --- restic_backup_timer_enabled: false (a reinstalled host before its restore) ---
    - name: Re-apply the role with the timer disabled
      ansible.builtin.include_role:
        name: danmwallace.linux.restic_backup
      vars:
        restic_backup_timer_enabled: false

    - name: Read the timer state  # noqa command-instead-of-module
      ansible.builtin.command: systemctl show -p UnitFileState -p ActiveState --value restic-backup.timer
      register: _timer_off
      changed_when: false

    - name: Assert the timer is installed but disabled and stopped
      ansible.builtin.assert:
        that: _timer_off.stdout_lines | sort == ['disabled', 'inactive']
        fail_msg: "timer: {{ _timer_off.stdout_lines }}"

    # --- restic_backup_install_packages: false (image-based hosts such as bootc) ---
    # Take btrfs away entirely: the real one converge installed and the fake
    # from prepare. If the install tasks still ran with the switch off, they
    # would put btrfs-progs back and the role would not fail.
    - name: Ensure btrfs-progs is absent for the image-based host checks
      ansible.builtin.package:
        name: btrfs-progs
        state: absent

    - name: Hide the fake btrfs
      ansible.builtin.command:
        cmd: mv /usr/local/sbin/btrfs /usr/local/sbin/btrfs.hidden
        removes: /usr/local/sbin/btrfs

    - name: Apply the role without package installs while btrfs is missing
      block:
        - name: Run the role expected to fail (no btrfs)
          ansible.builtin.include_role:
            name: danmwallace.linux.restic_backup
          vars:
            restic_backup_install_packages: false
        - name: Record that the missing binary was not caught
          ansible.builtin.set_fact:
            _nopkg_failed: false
      rescue:
        - name: Record that the missing binary failed the play
          ansible.builtin.set_fact:
            _nopkg_failed: true
            _nopkg_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: Check whether a btrfs came back
      ansible.builtin.command:
        argv: [sh, -c, command -v btrfs]
      register: _nopkg_btrfs
      changed_when: false
      failed_when: false

    - name: Assert a missing binary fails the role, naming it and the image
      ansible.builtin.assert:
        that:
          - _nopkg_failed
          - "'btrfs (package btrfs-progs)' in _nopkg_msg"
          - "'image must provide' in _nopkg_msg"
          - "'restic (' not in _nopkg_msg"
          - "'sqlite3' not in _nopkg_msg"
          - _nopkg_btrfs.rc != 0
        fail_msg: "failed: {{ _nopkg_failed }}, msg: {{ _nopkg_msg | default('') }}, btrfs: {{ _nopkg_btrfs.stdout }}"

    - name: Apply the role without package installs or btrfs snapshots
      # btrfs is only required when snapshots are configured.
      ansible.builtin.include_role:
        name: danmwallace.linux.restic_backup
      vars:
        restic_backup_install_packages: false
        restic_backup_btrfs_snapshot_subvolumes: []

    - name: Restore the fake btrfs
      ansible.builtin.command:
        cmd: mv /usr/local/sbin/btrfs.hidden /usr/local/sbin/btrfs
        removes: /usr/local/sbin/btrfs.hidden

    - name: Apply the role without package installs when the host has every binary
      # The fake btrfs lives in /usr/local/sbin, so this also checks the lookup
      # goes through PATH rather than a fixed /usr/bin.
      ansible.builtin.include_role:
        name: danmwallace.linux.restic_backup
      vars:
        restic_backup_install_packages: false

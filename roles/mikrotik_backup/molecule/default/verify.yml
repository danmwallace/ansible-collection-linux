---
- name: Verify
  hosts: molecule
  gather_facts: false
  vars:
    backup_dir: /var/lib/mikrotik-backup
    remote_dir: /srv/routeros/disk1/backups
  tasks:
    - name: Stat installed files and directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/mikrotik-backup/mikrotik-backup.env
        - /etc/mikrotik-backup/id_ed25519
        - /usr/local/libexec/mikrotik-backup/run
        - "{{ backup_dir }}"
        - "{{ backup_dir }}/gw"
        - "{{ backup_dir }}/sw"
      register: _files

    - name: Assert secrets, script and backup directories are root-only
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode in ['0600', '0700']
      loop: "{{ _files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the rendered SSH aliases
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_config.d/60-mikrotik-backup.conf
      register: _ssh_config

    - name: Assert the aliases carry the hardening options and per-device defaults
      ansible.builtin.assert:
        that:
          - "'Host mikrotik-backup-gw' in _cfg"
          - "'Host mikrotik-backup-sw' in _cfg"
          - "'User backup' in _cfg"
          - "'Port 22' in _cfg"
          - "'IdentitiesOnly yes' in _cfg"
          - "'BatchMode yes' in _cfg"
          - "'StrictHostKeyChecking yes' in _cfg"
      vars:
        _cfg: "{{ _ssh_config.content | b64decode }}"

    - name: Check the timer is enabled
      ansible.builtin.command: systemctl is-enabled mikrotik-backup.timer  # noqa command-instead-of-module
      register: _timer
      changed_when: false

    - name: Assert the timer is enabled
      ansible.builtin.assert:
        that: _timer.stdout == 'enabled'

    - name: Read today's date
      ansible.builtin.command: date +%Y%m%d
      register: _today
      changed_when: false

    - name: Plant stale local copies older than the retention window
      ansible.builtin.command:
        cmd: touch -d '20 days ago' {{ backup_dir }}/gw/home-01-20000101.rsc {{ backup_dir }}/sw/home-sw01-20000101.rsc
      changed_when: true

    - name: Run the pull while sw has an empty .backup and no .rsc
      ansible.builtin.command: /usr/local/libexec/mikrotik-backup/run
      register: _partial_run
      changed_when: false
      failed_when: _partial_run.rc == 0

    - name: Show the failing run's output
      ansible.builtin.debug:
        var: _partial_run.stderr_lines

    - name: Stat the backup directories after the failing run
      ansible.builtin.find:
        paths:
          - "{{ backup_dir }}/gw"
          - "{{ backup_dir }}/sw"
        hidden: true
      register: _after_fail

    - name: Stat whether uptime kuma was pinged
      ansible.builtin.stat:
        path: /tmp/kuma-pushes
      register: _kuma_after_fail

    - name: Assert the failing run kept going, logged clearly and skipped the push
      ansible.builtin.assert:
        that:
          - "'mikrotik-backup: ERROR: sw: disk1/backups/home-sw01-' ~ _today.stdout ~ '.backup is missing or empty on the device' in _partial_run.stderr_lines"
          - "'mikrotik-backup: ERROR: sw: disk1/backups/home-sw01-' ~ _today.stdout ~ '.rsc is missing or empty on the device' in _partial_run.stderr_lines"
          - "'mikrotik-backup: ERROR: failed devices: sw; not reporting to uptime kuma' in _partial_run.stderr_lines"
          - "'mikrotik-backup: gw: fetched home-01-' ~ _today.stdout ~ '.backup and home-01-' ~ _today.stdout ~ '.rsc' in _partial_run.stdout_lines"
          - _names | sort == ['home-01-' ~ _today.stdout ~ '.backup', 'home-01-' ~ _today.stdout ~ '.rsc', 'home-sw01-20000101.rsc'] | sort
          - _after_fail.files | selectattr('mode', 'ne', '0600') | list | length == 0
          - not _kuma_after_fail.stat.exists
      vars:
        _names: "{{ _after_fail.files | map(attribute='path') | map('basename') | list }}"

    - name: Read a fetched file back
      ansible.builtin.slurp:
        src: "{{ backup_dir }}/gw/home-01-{{ _today.stdout }}.rsc"
      register: _gw_rsc

    - name: Assert the fetched file matches the device copy
      ansible.builtin.assert:
        that: _gw_rsc.content | b64decode == "# fake export from home-01\n"

    - name: Complete sw's pair on the device
      ansible.builtin.copy:
        dest: "{{ remote_dir }}/{{ item }}"
        content: "fake content for {{ item }}\n"
        owner: backup
        group: backup
        mode: "0644"
      loop:
        - "home-sw01-{{ _today.stdout }}.backup"
        - "home-sw01-{{ _today.stdout }}.rsc"

    - name: Run one pull through the service
      ansible.builtin.systemd:
        name: mikrotik-backup.service
        state: started

    - name: List the backup directories after the successful run
      ansible.builtin.find:
        paths:
          - "{{ backup_dir }}/gw"
          - "{{ backup_dir }}/sw"
        hidden: true
      register: _after_ok

    - name: Read the recorded uptime kuma pushes
      ansible.builtin.slurp:
        src: /tmp/kuma-pushes
      register: _kuma

    - name: Assert every device was pulled, stale copies pruned and kuma pinged once
      ansible.builtin.assert:
        that:
          - _names | sort == _expected | sort
          - _after_ok.files | selectattr('mode', 'ne', '0600') | list | length == 0
          - (_kuma.content | b64decode).splitlines() | length == 1
          - "'https://kuma.invalid/api/push/molecule?status=up&msg=OK' in (_kuma.content | b64decode)"
      vars:
        _names: "{{ _after_ok.files | map(attribute='path') | map('basename') | list }}"
        _expected:
          - "home-01-{{ _today.stdout }}.backup"
          - "home-01-{{ _today.stdout }}.rsc"
          - "home-sw01-{{ _today.stdout }}.backup"
          - "home-sw01-{{ _today.stdout }}.rsc"

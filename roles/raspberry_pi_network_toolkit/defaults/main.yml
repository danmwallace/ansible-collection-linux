---
# defaults/main.yml - Default variables for raspberry_pi_network_toolkit

# User who will run the toolkit
toolkit_user: pi

# Whether to install Docker and Docker Compose
install_docker: true

# Whether to install GUI-based tools
install_gui_tools: false

# Docker Compose version to install
docker_compose_version: "v5.5.0"

# Whether to deploy monitoring containers
enable_monitoring: true

# Ports for monitoring services
monitoring_ports:
  portainer: 9000
  netdata: 19999
  uptime_kuma: 3001
  wireshark_web: 3000

# Directory for custom toolkit scripts
toolkit_scripts_dir: /opt/network-toolkit

# Service hostnames for Traefik reverse proxy
portainer_hostname: "portainer.example.com"
netdata_hostname: "netdata.example.com"
uptime_kuma_hostname: "uptime.example.com"

# Container image versions
portainer_version: '2.39.4'
# NOTE: uptime-kuma 2.x is a major version bump from 1.x and requires a data migration.
# Review https://github.com/louislam/uptime-kuma/wiki before upgrading existing installs.
uptime_kuma_version: '2.4.0'
netdata_version: 'v2.5.3'
# NOTE: ghcr.io/tecnativa/docker-socket-proxy:0.4.2 supports arm64 and arm/v7.
# Verify the image manifest for your specific Raspberry Pi model before deploying.
portainer_socket_proxy_version: "0.4.2"

---
# Keep this run out of the owner's ~/.ansible; see .config/molecule/collections.yml.
prerun: false
dependency:
  name: galaxy
  options:
    force: true
    collections-path: ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible_home/collections
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../.config/molecule/collections.yml
ansible:
  env:
    ANSIBLE_HOME: ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible_home
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible_home/collections:${HOME}/.ansible/collections:/usr/share/ansible/collections
driver:
  name: default
  options:
    managed: true
platforms:
  - name: linux-rpi-toolkit-instance
provisioner:
  name: ansible
  inventory:
    hosts:
      molecule:
        hosts:
          linux-rpi-toolkit-instance:
            ansible_connection: containers.podman.podman
            ansible_python_interpreter: /usr/bin/python3
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    # side_effect puts back rpi-toolkit's old testssl.sh origin, then the whole
    # role runs under --check against the converged host, as in the rollout's
    # check-mode review (#44); converge again before verify.
    - side_effect
    - check
    - converge
    - verify
    - destroy

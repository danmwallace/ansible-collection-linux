---
driver:
  name: default
  options:
    managed: true
platforms:
  - name: syncthing-instance
provisioner:
  name: ansible
  inventory:
    hosts:
      molecule:
        hosts:
          syncthing-instance:
            ansible_connection: containers.podman.podman
            ansible_python_interpreter: /usr/bin/python3
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy

---
- name: Read the options on {{ syncthing_api.label }}
  ansible.builtin.uri:
    url: "{{ syncthing_api.url }}/rest/config/options"
    headers: { X-API-Key: "{{ syncthing_api.key }}" }
    ca_path: "{{ syncthing_api.ca or omit }}"
  register: syncthing_options_now
  check_mode: false
  no_log: true

- name: Settle the discovery and relay settings to apply
  ansible.builtin.set_fact:
    syncthing_options_patch: >-
      {{ {} | combine({'globalAnnounceEnabled': syncthing_global_discovery | bool}
                      if syncthing_options_now.json.globalAnnounceEnabled != (syncthing_global_discovery | bool) else {})
            | combine({'relaysEnabled': syncthing_relays | bool}
                      if syncthing_options_now.json.relaysEnabled != (syncthing_relays | bool) else {}) }}

- name: Report the settings a real run would change
  ansible.builtin.debug:
    msg: "would set {{ syncthing_options_patch }} on {{ syncthing_api.label }}"
  when: ansible_check_mode and syncthing_options_patch | length > 0
  changed_when: true

- name: Ensure discovery and relays are set on {{ syncthing_api.label }}
  ansible.builtin.uri:
    url: "{{ syncthing_api.url }}/rest/config/options"
    method: PATCH
    headers: { X-API-Key: "{{ syncthing_api.key }}" }
    ca_path: "{{ syncthing_api.ca or omit }}"
    body_format: json
    body: "{{ syncthing_options_patch }}"
  when: not ansible_check_mode and syncthing_options_patch | length > 0
  changed_when: true
  no_log: true

---
# A device in one Syncthing's config, added from Syncthing's own defaults or corrected in
# place. Reads first and writes only what differs.
- name: Read a device for {{ syncthing_device.name ~ ' on ' ~ syncthing_api.label }}
  ansible.builtin.include_tasks: call.yml
  vars:
    syncthing_call: { path: "config/devices/{{ syncthing_device.id }}", ok: [200, 404] }

- name: Keep what the device looks like now
  ansible.builtin.set_fact:
    syncthing_device_now: "{{ syncthing_response }}"
  no_log: true

- name: Read the device defaults when it is new
  ansible.builtin.include_tasks: call.yml
  vars:
    syncthing_call: { path: config/defaults/device }
  when: syncthing_device_now.status == 404

- name: Settle whether the device needs a change
  ansible.builtin.set_fact:
    syncthing_device_change: >-
      {{ syncthing_device_now.status == 404
         or syncthing_device_now.json.name != syncthing_device.name
         or syncthing_device_now.json.addresses != syncthing_device.addresses }}
    syncthing_device_base: "{{ syncthing_response.json if syncthing_device_now.status == 404 else syncthing_device_now.json }}"
  no_log: true

- name: Report the device change a real run would make on {{ syncthing_api.label }}
  ansible.builtin.debug:
    msg: >-
      would {{ 'add' if syncthing_device_now.status == 404 else 'update' }} device {{ syncthing_device.name }}
      ({{ syncthing_device.id[:7] }}) at {{ syncthing_device.addresses | join(', ') }}
  when: ansible_check_mode and syncthing_device_change | bool
  changed_when: true

- name: Write the device for {{ syncthing_device.name ~ ' on ' ~ syncthing_api.label }}
  ansible.builtin.include_tasks: call.yml
  vars:
    syncthing_call:
      method: PUT
      path: "config/devices/{{ syncthing_device.id }}"
      body: >-
        {{ syncthing_device_base | combine({'deviceID': syncthing_device.id, 'name': syncthing_device.name,
           'addresses': syncthing_device.addresses}) }}
  when: not ansible_check_mode and syncthing_device_change | bool
